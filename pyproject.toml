[project]
name = "tfm-drift"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "joblib==1.5.3",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
