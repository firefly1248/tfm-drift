[project]
name = "tfm-drift"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "joblib==1.5.3",
    "torch==2.10.0",
    "tabpfn==9.0.0",
    "tabicl==2.1.1",
    "tabfm[pytorch]==1.0.1",
    "catboost==1.2.10",
    "lightgbm==4.6.0",
    "xgboost==3.2.0",
    "optuna==4.7.0",
    "category-encoders==2.9.0",  # SDB's logistic-regression pipeline
    "matplotlib==3.11.2",
    "openml==0.15.1",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
